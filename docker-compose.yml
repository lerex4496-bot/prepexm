services:
  db:
    image: postgres:16-alpine
    container_name: studymate-db
    environment:
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate
      POSTGRES_DB: studymate
    ports:
      # 55432 on the host so this never collides with a local Postgres install.
      - "55432:5432"
    volumes:
      - studymate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymate -d studymate"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  studymate_pgdata:
